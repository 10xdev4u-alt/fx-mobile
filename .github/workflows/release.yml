name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
      
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
      
      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/fx-mobile-${{ github.ref_name }}-debug.apk
          mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/fx-mobile-${{ github.ref_name }}-release.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/*.apk
          body: |
            ## fx-Mobile ${{ github.ref_name }}
            
            ### Downloads
            - **fx-mobile-${{ github.ref_name }}-debug.apk** - Debug build
            - **fx-mobile-${{ github.ref_name }}-release.apk** - Release build (unsigned)
            
            ### Installation
            1. Download the APK
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK
            4. Open fx and enter your Kilo API key
            
            ### Requirements
            - Android 8.0+ (API 26)
            - 4GB RAM recommended
            - Internet connection for AI features
          generate_release_notes: true
          draft: false
          prerelease: false
